buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0,6.2)', changing: true
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = project.mod_version
group = project.mod_group_id
archivesBaseName = 'locks_reforged'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Carry On compatibility is optional and compiled only when its jar is vendored under libs/ (gitignored,
// like respawningstructures). Unlike that reflection-based compat, the Carry On compat uses mixins that
// need the target classes on the compile classpath, so when the jar is absent we skip the whole thing:
// exclude the compat mixin sources + config and drop the extra mixin wiring. The mod still builds fine.
ext.carryOnJar = file('libs/carryon-forge-1.20.1-2.1.2.7.jar')
ext.hasCarryOn = carryOnJar.exists()
if (!hasCarryOn)
    logger.lifecycle("Carry On jar not found at ${carryOnJar} — building without Carry On compatibility.")

minecraft {
    mappings channel: project.mapping_channel, version: project.mapping_version

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')

            arg "-mixin.config=${project.mod_id}.mixins.json"
            if (project.hasCarryOn) arg "-mixin.config=${project.mod_id}_carryon.mixins.json"

            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            arg "-mixin.config=${project.mod_id}.mixins.json"
            if (project.hasCarryOn) arg "-mixin.config=${project.mod_id}_carryon.mixins.json"

            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            property 'forge.logging.console.level', 'info'

            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

processResources {
    // Track mod_version as a task input so changing the version in gradle.properties invalidates this task.
    // Without this, `expand` does not register the property as an input and processResources stays UP-TO-DATE,
    // baking a stale version into mods.toml even though the jar filename updates (the recurring mislabel bug).
    inputs.property 'mod_version', project.mod_version
    filesMatching('META-INF/mods.toml') {
        expand 'mod_version': project.mod_version
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

if (!hasCarryOn) {
    sourceSets.main.java { exclude 'melonslise/locks/mixin/carryon/**' }
    processResources { exclude 'locks_carryon.mixins.json' }
}

repositories {
    maven {
        name = "Illusive Soulworks"
        url = "https://maven.theillusivec4.top/"
    }
    // Vendored mod jars under libs/ (gitignored). flatDir lets fg.deobf() remap them from production
    // to dev mappings, which files(...) cannot do.
    flatDir { dirs 'libs' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1")

    if (project.hasCarryOn) {
        // MixinExtras @Local (used by the Carry On placement mixin). Forge 47.2 bundles MixinExtras at
        // runtime, so this is compileOnly for the annotation only.
        compileOnly "io.github.llamalad7:mixinextras-common:0.4.0"

        // Carry On, resolved from the flatDir 'libs' repo (file: libs/carryon-forge-1.20.1-2.1.2.7.jar).
        // compileOnly so the mixin annotation processor can resolve the target classes (tschipp.carryon.*)
        // at compile time; runtimeOnly so the compat mixins can be exercised via runClient/runServer.
        // Neither is bundled in the shipped jar. The group is arbitrary/ignored by flatDir; name+version
        // must match the filename so fg.deobf can remap it from production to dev mappings.
        compileOnly fg.deobf("blank:carryon-forge-1.20.1:2.1.2.7")
        runtimeOnly fg.deobf("blank:carryon-forge-1.20.1:2.1.2.7")
    }

    // Unit tests for pure logic (geometry, NBT round-trips, id counter). testImplementation extends
    // implementation, so the deobfuscated Minecraft classpath is available — sufficient for the plain data
    // classes these tests touch (BlockPos, CompoundTag, byte arrays); no FML/Bootstrap launch required.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

mixin {
    add sourceSets.main, "${project.mod_id}.refmap.json"
    config "${project.mod_id}.mixins.json"
    if (project.hasCarryOn)
        config "${project.mod_id}_carryon.mixins.json"
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : project.mod_id,
            "Specification-Vendor"    : project.mod_authors,
            "Specification-Version"   : project.mod_version,
            "Implementation-Title"    : project.mod_id,
            "Implementation-Version"  : project.mod_version,
            "Implementation-Vendor"   : project.mod_authors,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs"            : project.hasCarryOn ? "${project.mod_id}.mixins.json,${project.mod_id}_carryon.mixins.json" : "${project.mod_id}.mixins.json"
        ])
    }
}

jar.finalizedBy('reobfJar')
